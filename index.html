<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesada+</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f4;--card:#fff;--ink:#1c2b24;--mute:#6b7c73;--g:#14a36b;--g2:#0e7c52;--gl:#e3f6ec;--r:#e0533d;--rl:#fdeae6;--y:#f5b623;--line:#e3ebe6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:22px 20px 60px;border-radius:0 0 28px 28px}
header .logo{font-weight:900;font-size:22px;letter-spacing:-.5px}
header .logo span{color:#c6f7dd}
header .sub{opacity:.85;font-size:14px;margin-top:2px}
main{max-width:520px;margin:-44px auto 0;padding:0 16px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(20,60,40,.06)}
h2{font-size:17px;font-weight:800;margin-bottom:10px}
.big{font-size:34px;font-weight:900;letter-spacing:-1px}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--g)}
button{font:inherit;cursor:pointer;border:none}
.btn{width:100%;padding:13px;border-radius:14px;background:var(--g);color:#fff;font-weight:800;font-size:16px;margin-top:12px}
.btn.out{background:var(--gl);color:var(--g2)}
.btn.red{background:var(--rl);color:var(--r)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;background:none;padding:6px 0;font-size:11px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .i{font-size:21px}
.tabs button.on{color:var(--g)}
.view{display:none}.view.on{display:block}
.bar{height:12px;background:var(--gl);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>div{height:100%;background:var(--g);border-radius:99px;transition:width .4s}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .v{font-weight:800}
.plus{color:var(--g)}.minus{color:var(--r)}
.x{background:none;color:#b7c4bd;font-size:18px;padding:4px}
.seg{display:flex;background:var(--gl);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;background:none;font-weight:800;color:var(--g2)}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg.r button.on{color:var(--r)}
.res{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.resb{border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.resb b{font-size:19px;font-weight:900}
svg text{font-family:Nunito}
.empty{text-align:center;color:var(--mute);padding:16px 0;font-size:14px}
.quizopt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--bg);margin-top:8px;font-weight:700;font-size:15px;color:var(--ink)}
.quizopt.ok{background:var(--gl);color:var(--g2)}
.quizopt.no{background:var(--rl);color:var(--r)}
.tip{background:#fff7e0;border-radius:14px;padding:12px 14px;font-size:14px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips button{padding:7px 11px;border-radius:99px;background:var(--bg);font-weight:700;font-size:13px;color:var(--ink)}
.chips button.on{background:var(--g);color:#fff}

.gear{background:rgba(255,255,255,.18);border-radius:14px;width:42px;height:42px;font-size:20px;color:#fff}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--bg);font-weight:800;font-size:15px;color:var(--ink);border:2px solid transparent;text-align:left}
.lang span{font-size:24px}
.lang.on{border-color:var(--g);background:var(--gl);color:var(--g2)}
.row>div{display:flex;flex-direction:column;justify-content:flex-end}
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <div class="logo">Mesada<span>+</span></div>
      <div class="sub" data-t="sub"></div>
    </div>
    <button class="gear" id="gear" aria-label="settings">⚙️</button>
  </div>
</header>
<main>

<section class="view on" id="v-home">
  <div class="card">
    <div class="mute" data-t="balance"></div>
    <div class="big" id="saldo"></div>
    <div class="row" style="margin-top:12px">
      <div><span class="pill" style="background:var(--gl);color:var(--g2)" data-t="in"></span><div style="font-weight:800;margin-top:4px" id="tin"></div></div>
      <div><span class="pill" style="background:var(--rl);color:var(--r)" data-t="out"></span><div style="font-weight:800;margin-top:4px" id="tout"></div></div>
      <div><span class="pill" style="background:#fff3d6;color:#a87500" data-t="saved"></span><div style="font-weight:800;margin-top:4px" id="tsave"></div></div>
    </div>
  </div>
  <div class="card"><h2 data-t="whereMoney"></h2><div id="cats"></div></div>
  <div class="card"><h2 data-t="mainGoal"></h2><div id="mainGoal"></div></div>
  <div class="card"><h2 data-t="tipDay"></h2><div id="dica" style="font-size:15px"></div></div>
</section>

<section class="view" id="v-mov">
  <div class="card">
    <h2 data-t="register"></h2>
    <div class="seg" id="tipoSeg">
      <button class="on" data-tp="in" data-t="entry"></button>
      <button data-tp="out" data-t="expense"></button>
    </div>
    <label data-t="amount"></label>
    <input id="mVal" type="number" inputmode="decimal" placeholder="50">
    <label data-t="desc"></label>
    <input id="mDesc" data-ph="descPh">
    <label data-t="category"></label>
    <div class="chips" id="mCats"></div>
    <button class="btn" id="mAdd" data-t="add"></button>
  </div>
  <div class="card"><h2 data-t="history"></h2><div id="movList"></div></div>
</section>

<section class="view" id="v-goals">
  <div class="card">
    <h2 data-t="newGoal"></h2>
    <label data-t="whatWant"></label>
    <input id="gName" data-ph="goalPh">
    <div class="row">
      <div><label data-t="cost"></label><input id="gVal" type="number" inputmode="decimal" placeholder="1500"></div>
      <div><label data-t="months"></label><input id="gMon" type="number" inputmode="numeric" placeholder="8"></div>
    </div>
    <div class="tip" id="gHint" style="display:none"></div>
    <button class="btn" id="gAdd" data-t="createGoal"></button>
  </div>
  <div id="goalList"></div>
</section>

<section class="view" id="v-sim">
  <div class="card">
    <h2 data-t="simTitle"></h2>
    <div class="row">
      <div><label data-t="perMonth"></label><input id="sMes" type="number" inputmode="decimal" value="50"></div>
      <div><label data-t="years"></label><input id="sAnos" type="number" inputmode="numeric" value="5"></div>
    </div>
    <div class="row">
      <div><label data-t="savingsRate"></label><input id="sPoup" type="number" inputmode="decimal" value="7" step="0.1"></div>
      <div><label data-t="selicRate"></label><input id="sTes" type="number" inputmode="decimal" value="12" step="0.1"></div>
    </div>
    <div class="mute" style="margin-top:6px" data-t="ratesNote"></div>
    <div class="res" id="sRes"></div>
  </div>
  <div class="card">
    <h2 data-t="growth"></h2>
    <div id="chart"></div>
    <div class="row mute" style="margin-top:8px;font-size:12px;flex-wrap:wrap;gap:12px">
      <span><b style="color:#9aa8a0">●</b> <span data-t="piggy"></span></span>
      <span><b style="color:var(--y)">●</b> <span data-t="savings"></span></span>
      <span><b style="color:var(--g)">●</b> <span data-t="selic"></span></span>
    </div>
  </div>
</section>

<section class="view" id="v-learn">
  <div class="card"><h2 data-t="quizTitle"></h2><div class="mute" id="qProg"></div><div id="quiz"></div></div>
  <div class="card"><h2 data-t="dict"></h2><div id="dic"></div></div>
</section>

<section class="view" id="v-set">
  <button class="btn out" id="setBack" style="margin:0 0 14px;width:auto;padding:10px 16px" data-t="back"></button>
  <div class="card">
    <h2 data-t="language"></h2>
    <div class="langs" id="langs"></div>
    <div class="mute" style="margin-top:10px" data-t="langNote"></div>
  </div>
  <div class="card">
    <h2 data-t="myData"></h2>
    <button class="btn red" id="reset" style="margin-top:0" data-t="reset"></button>
    <div id="resetConfirm" style="display:none">
      <div class="tip" data-t="resetSure"></div>
      <div class="row"><button class="btn out" id="resetNo" data-t="cancel"></button><button class="btn red" id="resetYes" data-t="del"></button></div>
    </div>
  </div>
</section>

</main>

<nav class="tabs">
  <button class="on" data-v="home"><span class="i">🏠</span><span data-t="tHome"></span></button>
  <button data-v="mov"><span class="i">💸</span><span data-t="tMov"></span></button>
  <button data-v="goals"><span class="i">🎯</span><span data-t="tGoals"></span></button>
  <button data-v="sim"><span class="i">📈</span><span data-t="tSim"></span></button>
  <button data-v="learn"><span class="i">🧠</span><span data-t="tLearn"></span></button>
</nav>
<div class="toast" id="toast"></div>

const $=id=>document.getElementById(id);
const KEY='mesadaplus_v2',LKEY='mesadaplus_lang';
let S={mov:[],goals:[]};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.mov)S=d;}catch(e){}
let LANG='pt';
try{const l=localStorage.getItem(LKEY);if(l&&T[l])LANG=l;}catch(e){}
const L=()=>T[LANG];
const brl=v=>'R$ '+v.toLocaleString(LANGS[LANG].loc,{minimumFractionDigits:2,maximumFractionDigits:2});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ICON={mesada:'💰',trabalho:'🛠️',presente:'🎁',outro_in:'✨',comida:'🍔',jogos:'🎮',roupa:'👕',escola:'📚',transporte:'🚌',meta:'🎯',outro:'📦'};
const GROUPS={in:['mesada','trabalho','presente','outro_in'],out:['comida','jogos','roupa','escola','transporte','meta','outro']};
const catName=c=>L().cats[c]||L().cats.outro;
const catIcon=c=>ICON[c]||'📦';

// textos fixos da tela
function applyLang(){
  document.documentElement.lang=LANGS[LANG].loc;
  document.querySelectorAll('[data-t]').forEach(el=>{const v=L()[el.dataset.t];if(typeof v==='string')el.textContent=v;});
  document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=L()[el.dataset.ph]);
  $('langs').innerHTML=Object.entries(LANGS).map(([k,v])=>`<button class="lang ${k===LANG?'on':''}" data-l="${k}"><span>${v.flag}</span>${v.name}</button>`).join('');
  $('langs').querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  drawChips();goalHint();render();sim();dica();dic();montaQuiz();qi=0;score=0;quiz();
}
function setLang(l){LANG=l;try{localStorage.setItem(LKEY,l);}catch(e){}applyLang();toast(L().langChanged);}

// navegação
function show(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  window.scrollTo(0,0);if(v==='sim')sim();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('gear').onclick=()=>show('set');
$('setBack').onclick=()=>show('home');

// mesada
let tipo='in',cat='mesada';
function drawChips(){
  $('mCats').innerHTML=GROUPS[tipo].map(k=>`<button data-c="${k}" class="${k===cat?'on':''}">${catIcon(k)} ${catName(k)}</button>`).join('');
  $('mCats').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;drawChips();});
}
document.querySelectorAll('#tipoSeg button').forEach(b=>b.onclick=()=>{
  tipo=b.dataset.tp;cat=GROUPS[tipo][0];
  document.querySelectorAll('#tipoSeg button').forEach(x=>x.classList.toggle('on',x===b));
  $('tipoSeg').classList.toggle('r',tipo==='out');drawChips();
});
$('mAdd').onclick=()=>{
  const v=parseFloat($('mVal').value);
  if(!(v>0)){toast(L().typeValue);return;}
  const d=$('mDesc').value.trim();
  S.mov.push({id:Date.now(),t:tipo,v,d,c:cat,ts:Date.now()});
  if(cat==='meta'&&S.goals.length){S.goals[0].s+=v;}
  $('mVal').value='';$('mDesc').value='';save();render();
  toast(tipo==='in'?L().entryOk:L().expenseOk);
};

// metas
function goalHint(){
  const v=parseFloat($('gVal').value),m=parseInt($('gMon').value);
  if(v>0&&m>0){$('gHint').style.display='block';$('gHint').innerHTML=L().needSave(brl(v/m),brl(v/m/4.3));}
  else $('gHint').style.display='none';
}
['gVal','gMon'].forEach(i=>$(i).oninput=goalHint);
$('gAdd').onclick=()=>{
  const n=$('gName').value.trim(),v=parseFloat($('gVal').value),m=parseInt($('gMon').value);
  if(!n||!(v>0)||!(m>0)){toast(L().fill3);return;}
  S.goals.push({id:Date.now(),n,v,m,s:0,ts:Date.now()});
  ['gName','gVal','gMon'].forEach(i=>$(i).value='');goalHint();save();render();toast(L().goalCreated);
};
function goalCard(g,actions){
  const p=Math.min(100,g.s/g.v*100),falta=Math.max(0,g.v-g.s);
  const passados=Math.max(0,(Date.now()-g.ts)/(30*864e5));
  const restante=Math.max(1,Math.ceil(g.m-passados));
  return `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b style="font-size:16px">${esc(g.n)}</b><span class="mute">${brl(g.s)} ${L().of} ${brl(g.v)}</span></div>
  <div class="bar"><div style="width:${p}%"></div></div>
  <div class="mute">${p>=100?L().goalDone:L().left(p.toFixed(0),brl(falta),brl(falta/restante),restante)}</div>
  ${actions?`<div class="row" style="margin-top:6px"><input type="number" inputmode="decimal" placeholder="R$" id="gi${g.id}"><button class="btn" style="margin-top:0" onclick="addTo(${g.id})">${L().saveBtn}</button><button class="btn red" style="margin-top:0;flex:.4" onclick="delGoal(${g.id})">🗑</button></div>`:''}`;
}
window.addTo=id=>{
  const g=S.goals.find(x=>x.id===id),v=parseFloat($('gi'+id).value);
  if(!(v>0))return toast(L().typeValue);
  g.s+=v;S.mov.push({id:Date.now(),t:'out',v,d:'',goal:g.n,c:'meta',ts:Date.now()});
  save();render();toast(g.s>=g.v?L().goalDone:L().savedOk);
};
window.delGoal=id=>{S.goals=S.goals.filter(x=>x.id!==id);save();render();toast(L().goalRemoved);};
window.delMov=id=>{S.mov=S.mov.filter(x=>x.id!==id);save();render();};

// título de uma movimentação (traduz os textos automáticos)
function movTitle(m){
  if(m.goal)return L().savedPrefix+m.goal;
  if(m.d&&/^Guardado: /.test(m.d))return L().savedPrefix+m.d.slice(10);
  return m.d||catName(m.c);
}

function render(){
  const tin=S.mov.filter(m=>m.t==='in').reduce((a,m)=>a+m.v,0);
  const tout=S.mov.filter(m=>m.t==='out'&&m.c!=='meta').reduce((a,m)=>a+m.v,0);
  const tsave=S.mov.filter(m=>m.c==='meta').reduce((a,m)=>a+m.v,0);
  $('saldo').textContent=brl(tin-tout-tsave);
  $('tin').textContent=brl(tin);$('tout').textContent=brl(tout);$('tsave').textContent=brl(tsave);
  const by={};S.mov.filter(m=>m.t==='out').forEach(m=>by[m.c]=(by[m.c]||0)+m.v);
  const tot=Object.values(by).reduce((a,b)=>a+b,0);
  $('cats').innerHTML=tot?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px"><span>${catIcon(c)} ${catName(c)}</span><span>${brl(v)}</span></div><div class="bar" style="height:8px;margin:4px 0 0"><div style="width:${v/tot*100}%;background:${c==='meta'?'var(--y)':'var(--g)'}"></div></div></div>`).join(''):`<div class="empty">${L().noSpend}</div>`;
  $('mainGoal').innerHTML=S.goals.length?goalCard(S.goals[0],false):`<div class="empty">${L().createGoalHint}</div>`;
  const M=[...S.mov].sort((a,b)=>b.ts-a.ts);
  $('movList').innerHTML=M.length?M.map(m=>{const neg=m.t==='out';return `<div class="item"><div class="ico" style="background:${neg?'var(--rl)':'var(--gl)'}">${catIcon(m.c)}</div><div class="t"><b>${esc(movTitle(m))}</b><span class="mute">${new Date(m.ts).toLocaleDateString(LANGS[LANG].loc)}</span></div><div class="v ${neg?'minus':'plus'}">${neg?'−':'+'}${brl(m.v)}</div><button class="x" onclick="delMov(${m.id})">×</button></div>`}).join(''):`<div class="empty">${L().nothingYet}</div>`;
  $('goalList').innerHTML=S.goals.map(g=>`<div class="card">${goalCard(g,true)}</div>`).join('')||`<div class="card empty">${L().noGoals}</div>`;
}

// simulador
function fv(mes,anual,meses){const r=Math.pow(1+anual/100,1/12)-1;if(!r)return mes*meses;return mes*((Math.pow(1+r,meses)-1)/r)*(1+r);}
function sim(){
  const mes=Math.max(0,parseFloat($('sMes').value)||0),anos=Math.min(40,Math.max(1,parseInt($('sAnos').value)||1));
  const p=parseFloat($('sPoup').value)||0,t=parseFloat($('sTes').value)||0,n=anos*12;
  const c=mes*n,pv=fv(mes,p,n),tv=fv(mes,t,n),l=L();
  $('sRes').innerHTML=`
   <div class="resb" style="background:#f0f3f1"><span>🐷 ${l.piggy}<br><span class="mute">${l.noYield}</span></span><b>${brl(c)}</b></div>
   <div class="resb" style="background:#fff5dc"><span>🏦 ${l.savings}<br><span class="mute">+${brl(pv-c)} ${l.interest}</span></span><b>${brl(pv)}</b></div>
   <div class="resb" style="background:var(--gl)"><span>📈 ${l.selic}<br><span class="mute">+${brl(tv-c)} ${l.interest}*</span></span><b style="color:var(--g2)">${brl(tv)}</b></div>
   <div class="mute">${l.pocket(brl(c))}</div>`;
  const W=480,H=220,pad=44,pts=[];for(let y=0;y<=anos;y++)pts.push([y,mes*12*y,fv(mes,p,12*y),fv(mes,t,12*y)]);
  const max=Math.max(...pts.map(x=>x[3]))||1;
  const X=y=>pad+(W-pad-10)*y/anos,Y=v=>H-26-(H-40)*v/max;
  const line=(i,col)=>`<polyline fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" points="${pts.map(q=>X(q[0])+','+Y(q[i])).join(' ')}"/>`;
  let grid='';for(let k=0;k<=4;k++){const v=max*k/4;grid+=`<line x1="${pad}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e3ebe6"/><text x="${pad-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#6b7c73">${v>=1000?(v/1000).toFixed(v>=10000?0:1)+'k':Math.round(v)}</text>`;}
  const step=Math.ceil(anos/8);let xl='';for(let y=0;y<=anos;y+=step)xl+=`<text x="${X(y)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#6b7c73">${y}${l.yr}</text>`;
  $('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}${xl}${line(1,'#9aa8a0')}${line(2,'#f5b623')}${line(3,'#14a36b')}<circle cx="${X(anos)}" cy="${Y(pts[anos][3])}" r="5" fill="#14a36b"/></svg>`;
}
['sMes','sAnos','sPoup','sTes'].forEach(i=>$(i).oninput=sim);

// quiz: 5 perguntas por dia, rodando pelas 40 sem repetir por 8 dias
function rng(seed){return()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;};}
function embaralha(a,r){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor((r||Math.random)()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const dia=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const ciclo=Math.floor(dia/8),bloco=dia%8;
const ordemCiclo=embaralha(embaralha(BANCO.pt.map((_,i)=>i),rng(2026)),rng(2026+ciclo));
let Q=[],qi=0,score=0;
function montaQuiz(){
  Q=ordemCiclo.slice(bloco*5,bloco*5+5).map(i=>{const[q,c,w1,w2,e]=BANCO[LANG][i];const o=embaralha([c,w1,w2]);return[q,o,o.indexOf(c),e];});
}
function quiz(){
  const l=L();
  if(qi>=Q.length){$('qProg').textContent='';$('quiz').innerHTML=`<div class="big" style="text-align:center;margin:10px 0">${score}/${Q.length}</div><div style="text-align:center">${score===Q.length?l.perfect:score>=3?l.good:l.tryAgain}</div><div class="mute" style="text-align:center;margin-top:6px">${l.tomorrow}</div><button class="btn" onclick="qi=0;score=0;montaQuiz();quiz()">${l.playAgain}</button>`;return;}
  const[q,o,c,e]=Q[qi];$('qProg').textContent=l.qProg(qi+1,Q.length,score);
  $('quiz').dataset.done='0';
  $('quiz').innerHTML=`<div style="font-weight:800;font-size:16px;margin-top:6px">${q}</div>`+o.map((t,i)=>`<button class="quizopt" data-i="${i}">${t}</button>`).join('')+'<div id="qe"></div>';
  $('quiz').querySelectorAll('.quizopt').forEach(b=>b.onclick=()=>{
    if($('quiz').dataset.done==='1')return;$('quiz').dataset.done='1';
    const i=+b.dataset.i;if(i===c)score++;
    $('quiz').querySelectorAll('.quizopt').forEach((x,j)=>{if(j===c)x.classList.add('ok');else if(j===i)x.classList.add('no');});
    $('qe').innerHTML=`<div class="tip">${i===c?l.right:l.almost} ${e}</div><button class="btn" id="qn">${qi+1<Q.length?l.next:l.result}</button>`;
    $('qn').onclick=()=>{qi++;quiz();};
  });
}

function dica(){$('dica').textContent=DICAS[LANG][(new Date().getDate()-1)%DICAS[LANG].length];}
function dic(){$('dic').innerHTML=DIC[LANG].map(([a,b])=>`<div class="item" style="display:block"><b>${a}</b><div class="mute" style="font-size:14px">${b}</div></div>`).join('');}

// apagar dados
$('reset').onclick=()=>{$('reset').style.display='none';$('resetConfirm').style.display='block';};
$('resetNo').onclick=()=>{$('reset').style.display='block';$('resetConfirm').style.display='none';};
$('resetYes').onclick=()=>{S={mov:[],goals:[]};save();render();$('resetNo').onclick();toast(L().dataDeleted);};

applyLang();save();

</script>
